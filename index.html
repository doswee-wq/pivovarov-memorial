<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>В ПАМЯТЬ ОБ ОЛЕГЕ ПИВОВАРОВЕ</title>
    <style>
        body {
            background-color: #0d0d0d;
            color: #00ff00;
            font-family: 'Courier New', Courier, monospace;
            margin: 0;
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            text-align: center;
            padding: 10px;
            box-sizing: border-box;
        }
        canvas {
            position: fixed;
            top: 0;
            left: 0;
            z-index: -1;
            opacity: 0.3;
        }
        h1 {
            font-size: 3rem;
            text-shadow: 0 0 10px #00ff00, 0 0 20px #00ff00;
            margin-bottom: 10px;
            text-transform: uppercase;
        }
        h2 {
            font-size: 1.5rem;
            margin-top: 0;
        }
        .container {
            background: rgba(0, 0, 0, 0.85);
            padding: 30px;
            border: 2px solid #00ff00;
            border-radius: 10px;
            box-shadow: 0 0 15px #00ff00;
            max-width: 800px;
            width: 100%;
            z-index: 1;
            box-sizing: border-box;
        }
        .info {
            font-size: 1.2rem;
            margin: 20px 0;
            line-height: 1.6;
            text-align: left;
            display: inline-block;
        }
        .highlight {
            color: #ff003c;
            font-weight: bold;
            text-shadow: 0 0 5px #ff003c;
        }
        .buttons-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            justify-content: center;
            margin-top: 30px;
        }
        button {
            background: #000;
            color: #00ff00;
            border: 1px solid #00ff00;
            padding: 12px 20px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s;
            text-transform: uppercase;
            flex: 1 1 calc(50% - 15px); /* Две кнопки в ряд на ПК */
            box-sizing: border-box;
        }
        button:hover, button:active {
            background: #00ff00;
            color: #000;
            box-shadow: 0 0 15px #00ff00;
        }
        .modal {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: #111;
            border: 2px solid #00ff00;
            padding: 25px;
            z-index: 100;
            box-shadow: 0 0 30px #00ff00;
            width: 90%;
            max-width: 400px;
            box-sizing: border-box;
        }
        .modal p {
            margin-bottom: 25px;
            font-size: 1.1rem;
            line-height: 1.4;
        }
        .modal button {
            flex: 1 1 100%;
            width: 100%;
        }

        /* --- МОБИЛЬНАЯ АДАПТАЦИЯ --- */
        @media (max-width: 600px) {
            h1 {
                font-size: 1.8rem;
            }
            h2 {
                font-size: 1.1rem;
            }
            .container {
                padding: 15px;
                border-width: 1px;
            }
            .info {
                font-size: 1rem;
                text-align: center;
                width: 100%;
            }
            button {
                flex: 1 1 100%; /* Одна кнопка в ряд на телефоне */
                padding: 15px 10px; /* Увеличенная зона для нажатия пальцем */
                font-size: 1.1rem;
            }
            .buttons-grid {
                gap: 10px;
            }
        }
    </style>
</head>
<body>
    <canvas id="matrix"></canvas>

    <div class="container">
        <h1>Олег Пивоваров</h1>
        <h2>[ 2010 - НАСТОЯЩЕЕ ВРЕМЯ ]</h2>
        
        <div class="info">
            <p>> Выпускник <strong>Курчатовской школы</strong></p>
            <p>> Начинал с малого: <span class="highlight">регал eSIM</span></p>
            <p>> Вышел на новый уровень: <span class="highlight">SIM-боксы</span></p>
            <br>
            <p style="text-align: center;">СТАТУС: <span class="highlight">ОФФЛАЙН (СИЗО №3)</span></p>
        </div>

        <div class="buttons-grid">
            <button onclick="showModal('SYSTEM ERROR: Запрос на УДО отклонен')">Внести залог</button>
            <button onclick="showModal('Загрузка логов... Данные зашифрованы')">Посмотреть логи</button>
            <button onclick="showModal('Связь с СИЗО №3 не установлена')">Позвонить в СИЗО</button>
            <button onclick="showModal('SIM-боксы конфискованы')">Проверить оборудование</button>
            <button onclick="showModal('Передача собрана. Ожидание курьера')">Собрать передачку</button>
            <button onclick="showModal('Курчатовская школа не дает комментариев')">Характеристика</button>
        </div>
    </div>

    <div id="alertModal" class="modal">
        <p id="modalText"></p>
        <button onclick="closeModal()">[ ЗАКРЫТЬ ]</button>
    </div>

    <script>
        // Matrix effect
        const canvas = document.getElementById('matrix');
        const ctx = canvas.getContext('2d');
        
        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas); // Адаптация матрицы при перевороте телефона
        
        const chars = '01';
        const fontSize = 16;
        let columns = canvas.width / fontSize;
        let drops = [];
        
        function initMatrix() {
            columns = canvas.width / fontSize;
            drops = [];
            for (let x = 0; x < columns; x++) {
                drops[x] = 1;
            }
        }
        initMatrix();
        window.addEventListener('resize', initMatrix);
        
        function draw() {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.05)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            ctx.fillStyle = '#0F0';
            ctx.font = fontSize + 'px monospace';
            
            for (let i = 0; i < drops.length; i++) {
                const text = chars.charAt(Math.floor(Math.random() * chars.length));
                ctx.fillText(text, i * fontSize, drops[i] * fontSize);
                
                if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) {
                    drops[i] = 0;
                }
                drops[i]++;
            }
        }
        
        setInterval(draw, 33);

        // Modal logic
        function showModal(text) {
            document.getElementById('modalText').innerText = '> ' + text;
            document.getElementById('alertModal').style.display = 'block';
        }

        function closeModal() {
            document.getElementById('alertModal').style.display = 'none';
        }
    </script>
</body>
</html>
